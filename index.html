<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setup Studio — Gaming Room & PC Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Press+Start+2P&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060d;--panel:rgba(14,11,26,.93);--panel2:rgba(26,20,48,.9);--line:#2c2452;--txt:#ece9ff;--mut:#9b93cc;--acc:#a855f7;--acc2:#22d3ee;--bad:#f43f5e;--warn:#f59e0b;--ok:#22c55e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif}
#view{position:fixed;inset:0}
#view canvas{display:block;touch-action:none;outline:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 11px;transition:.15s}
button:hover{border-color:var(--acc);box-shadow:0 0 12px rgba(168,85,247,.35)}
button.pri{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#b77cff;font-weight:600}
button.sm{padding:4px 8px;font-size:12px;border-radius:7px}
button.on{border-color:var(--acc2);box-shadow:0 0 10px rgba(34,211,238,.4)}
select,input[type=text],input[type=number],textarea{background:#120e24;border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;max-width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
input[type=color]{width:42px;height:30px;border:1px solid var(--line);border-radius:8px;background:#120e24;padding:2px;cursor:pointer}
input[type=range]{accent-color:var(--acc);width:100%}
.hidden{display:none!important}
#top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(180deg,rgba(7,6,13,.95),rgba(7,6,13,.6));border-bottom:1px solid var(--line);z-index:5}
#top .logo{font:900 18px Orbitron,sans-serif;letter-spacing:2px;background:linear-gradient(90deg,#c084fc,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;margin-right:6px}
#top .sp{flex:1}
#top .grp{display:flex;gap:6px;align-items:center}
#side{position:fixed;left:10px;top:64px;bottom:10px;width:318px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;z-index:4;backdrop-filter:blur(8px);overflow:hidden}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--line)}
#tabs button{padding:7px 4px;font-size:12px;font-weight:600}
#tabs button.act{background:linear-gradient(135deg,#5b21b6,#7c3aed);border-color:#a78bfa}
#cat{flex:1;overflow:auto;padding:10px}
#cat h3{font:700 12px Orbitron,sans-serif;letter-spacing:1.5px;color:var(--mut);margin:14px 2px 8px}
#cat h3:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{background:#130f26;border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;cursor:pointer;font-size:11.5px;line-height:1.2;transition:.15s;user-select:none;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tile:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 0 14px rgba(168,85,247,.3)}
.tile .ic{font-size:26px;line-height:1}
.tile img{width:44px;height:58px;object-fit:cover;border-radius:4px;box-shadow:0 2px 8px #000}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row label{flex:0 0 108px;color:var(--mut);font-size:12.5px}
.row .f{flex:1;display:flex;gap:6px;align-items:center;min-width:0}
.row .val{font-size:12px;color:var(--mut);min-width:38px;text-align:right}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#props{position:fixed;right:10px;top:64px;width:280px;max-height:calc(100% - 74px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;z-index:4;backdrop-filter:blur(8px)}
#props .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#props .ph b{flex:1;font:700 14px Orbitron,sans-serif;letter-spacing:1px}
#props .ph .ic{font-size:22px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(14,11,26,.8);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:12px;color:var(--mut);z-index:3;white-space:nowrap;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);opacity:0;background:#1d1538;border:1px solid var(--acc);padding:9px 16px;border-radius:10px;z-index:50;transition:.25s;pointer-events:none;box-shadow:0 0 20px rgba(168,85,247,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* PC builder */
#pcm{position:fixed;inset:0;background:rgba(3,2,8,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
.pcw{width:min(1180px,100%);height:min(820px,100%);background:#0d0a1c;border:1px solid #3b2f6e;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(124,58,237,.35)}
.pch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pch h2{margin:0;font:900 18px Orbitron,sans-serif;letter-spacing:2px;color:#d8b4fe}
.pch .cnt{color:var(--mut);font-size:12px}
.pch .sp{flex:1}
.pcb{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
#slots{border-right:1px solid var(--line);overflow:auto;padding:10px}
.slot{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px;cursor:pointer;background:#120e24;transition:.15s}
.slot:hover{border-color:#6d4bd1}
.slot.act{border-color:var(--acc);box-shadow:0 0 14px rgba(168,85,247,.35)}
.slot.bad{border-color:var(--bad)}
.slot .sl{display:flex;justify-content:space-between;font:700 11px Orbitron,sans-serif;letter-spacing:1px;color:var(--mut)}
.slot .sn{margin-top:3px;font-weight:600;font-size:13px}
.slot .sn.none{color:#6b6496;font-weight:500}
.slot .ss{font-size:11.5px;color:var(--mut)}
#picker{display:flex;flex-direction:column;min-height:0}
.pk-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pk-h b{font:700 14px Orbitron,sans-serif;letter-spacing:1px;margin-right:6px}
.pk-h input[type=text]{flex:1;min-width:160px}
#plist{flex:1;overflow:auto;padding:6px 10px}
.part{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid transparent;border-radius:10px;cursor:pointer}
.part:nth-child(odd){background:#110d22}
.part:hover{border-color:#6d4bd1}
.part.sel{border-color:var(--acc2);background:#0f2230}
.part.inc{opacity:.5}
.part .pn{font-weight:600;font-size:13px}
.part .ps{font-size:11.5px;color:var(--mut)}
.part .pp{font-weight:700;color:#c4b5fd;font-size:13px;white-space:nowrap}
.part .pc{font-size:11px;white-space:nowrap;max-width:190px;text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{height:8px;border-radius:9px;background:#1d173a;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a855f7,#f472b6)}
#pcsum{border-top:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px;align-items:center}
#pcsum .k{font-size:11px;color:var(--mut);font-family:Orbitron,sans-serif;letter-spacing:1px}
#pcsum .v{font-size:17px;font-weight:700}
.issues{font-size:12px;max-height:92px;overflow:auto}
.issues div{margin:2px 0}
.custom{border-top:1px solid var(--line);padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
#dlg{position:fixed;inset:0;z-index:40;background:rgba(3,2,8,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg .box{width:min(560px,100%);background:#0f0b20;border:1px solid #3b2f6e;border-radius:16px;padding:16px}
#dlg h3{margin:0 0 8px;font:700 15px Orbitron,sans-serif}
#dlg textarea{width:100%;height:180px;font:12px ui-monospace,monospace}
@media (max-width:820px){
 #side{top:auto;left:6px;right:6px;bottom:6px;width:auto;height:44vh}
 #props{top:60px;right:6px;width:min(270px,70vw);max-height:calc(56vh - 76px)}
 #hint{display:none}
 #top .hide-m{display:none}
 .pcb{grid-template-columns:1fr;grid-template-rows:38% 62%}
 #slots{border-right:none;border-bottom:1px solid var(--line)}
 #pcsum{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="view"></div>
<header id="top">
 <div class="logo">SETUP STUDIO</div>
 <div class="grp">
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
 </div>
 <div class="sp"></div>
 <div class="grp">
  <button id="vOver" class="hide-m">🎥 Overview</button>
  <button id="vPov">🎮 Gamer POV</button>
  <button id="vTop" class="hide-m">⬇ Top</button>
  <button id="bGlow" class="on" title="Bloom glow effect">✨ Glow</button>
  <button id="bPC" class="pri">🔧 PC Builder</button>
 </div>
</header>
<aside id="side"><nav id="tabs"></nav><div id="cat"></div></aside>
<aside id="props" class="hidden"></aside>
<div id="hint">Click an item to add it · Drag items to move · Drag empty space to orbit · Right-drag or Shift-drag to pan · Scroll to zoom · R rotate · Del delete · Ctrl+Z undo</div>
<div id="pcm" class="hidden"><div class="pcw">
 <div class="pch"><h2>PC BUILDER</h2><span class="cnt" id="pcCount"></span><span class="sp"></span><span class="note" style="margin:0">Quick builds:</span><span id="presets" class="btns" style="margin:0"></span><button id="pcClose" class="pri">Done ✓</button></div>
 <div class="pcb"><div id="slots"></div><div id="picker"></div></div>
 <div id="pcsum"></div>
</div></div>
<div id="dlg" class="hidden"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('view').innerHTML='<p style="padding:90px 20px;text-align:center">The 3D engine could not load. Check your internet connection and reload the page.</p>';return;}
const V3=THREE.Vector3;
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(k in e&&k!=='list')try{e[k]=v}catch(_){e.setAttribute(k,v)}else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let _uid=0;const uid=()=>'i'+Date.now().toString(36)+(_uid++).toString(36)+Math.random().toString(36).slice(2,5);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2300);}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
function rng(seed){let a=0;const s=String(seed);for(let i=0;i<s.length;i++)a=(a*31+s.charCodeAt(i))|0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const money=n=>'$'+Math.round(n).toLocaleString();
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(h));return c;}

/* ================= renderer / scene ================= */
const view=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const cv=renderer.domElement;cv.tabIndex=0;
const MAXANI=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();scene.background=new THREE.Color('#07060d');
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.03,100);
const hemi=new THREE.HemisphereLight('#c9c4ff','#2a1e3a',.5);scene.add(hemi);
const ambient=new THREE.AmbientLight('#ffffff',.1);scene.add(ambient);
const spot=new THREE.SpotLight('#fff1dd',1.5,0,1.25,.85,1);spot.castShadow=true;spot.shadow.mapSize.set(1024,1024);spot.shadow.bias=-.0006;spot.shadow.camera.near=.2;spot.shadow.camera.far=12;scene.add(spot);scene.add(spot.target);
const edgeLight=new THREE.PointLight('#a855f7',0,0,1);scene.add(edgeLight);
const POOL=[];for(let i=0;i<10;i++){const p=new THREE.PointLight('#ffffff',0,3,2);scene.add(p);POOL.push(p);}
let composer=null,bloom=null;
function setupComposer(){
 if(!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.RenderPass)return;
 try{
  const pr=renderer.getPixelRatio();let canHalf=false;try{const ex=renderer.extensions;canHalf=renderer.capabilities.isWebGL2?ex.has('EXT_color_buffer_float'):(ex.has('OES_texture_half_float')&&ex.has('EXT_color_buffer_half_float'));}catch(e){}const opts={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:canHalf?THREE.HalfFloatType:THREE.UnsignedByteType};
  let rt;if(renderer.capabilities.isWebGL2&&THREE.WebGLMultisampleRenderTarget){rt=new THREE.WebGLMultisampleRenderTarget(innerWidth*pr,innerHeight*pr,opts);rt.samples=4;}else rt=new THREE.WebGLRenderTarget(innerWidth*pr,innerHeight*pr,opts);
  composer=new THREE.EffectComposer(renderer,rt);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.85,.55,canHalf?.98:.8);
  composer.addPass(bloom);
  if(THREE.GammaCorrectionShader&&THREE.ShaderPass)composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  else {composer=null;}
 }catch(e){console.warn(e);composer=null;}
}
setupComposer();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer){composer.setSize(innerWidth,innerHeight);}if(bloom)bloom.resolution.set(innerWidth,innerHeight);});

/* ================= materials & mesh helpers ================= */
const M={std:(c,r=.6,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})};
function mesh(p,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);const glowy=mat.isMeshBasicMaterial||mat.transparent;m.castShadow=!glowy;m.receiveShadow=!glowy;p.add(m);return m;}
const box=(p,w,h,d,mat,x,y,z)=>mesh(p,new THREE.BoxGeometry(w,h,d),mat,x,y,z);
function cyl(p,rt,rb,h,mat,x,y,z,seg=24,axis='y'){const m=mesh(p,new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;return m;}
function sph(p,r,mat,x,y,z,sx=1,sy=1,sz=1){const m=mesh(p,new THREE.SphereGeometry(r,24,16),mat,x,y,z);m.scale.set(sx,sy,sz);return m;}
function tor(p,R,t,mat,x,y,z,axis='z',arc=Math.PI*2){const m=mesh(p,new THREE.TorusGeometry(R,t,8,40,arc),mat,x,y,z);if(axis==='x')m.rotation.y=Math.PI/2;if(axis==='y')m.rotation.x=Math.PI/2;return m;}
const plane=(p,w,h,mat,x,y,z)=>mesh(p,new THREE.PlaneGeometry(w,h),mat,x,y,z);
function disposeTree(o){o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose());}});}

/* ================= textures ================= */
const texCache=new Map();
function texFrom(c,repeat){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}return t;}
function cached(key,make){if(texCache.has(key)){const v=texCache.get(key);texCache.delete(key);texCache.set(key,v);return v;}const v=make();texCache.set(key,v);if(texCache.size>160){const k=texCache.keys().next().value;const old=texCache.get(k);texCache.delete(k);if(old&&old.dispose)old.dispose();}return v;}
const haloTex=(()=>{const c=mkCanvas(256,256),g=c.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);const t=new THREE.CanvasTexture(c);return t;})();
const bandTex=(()=>{const c=mkCanvas(256,128),g=c.getContext('2d');let gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,128);g.globalCompositeOperation='destination-in';gr=g.createLinearGradient(0,0,256,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.15,'rgba(0,0,0,1)');gr.addColorStop(.85,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,256,128);return new THREE.CanvasTexture(c);})();
const fadeTex=(()=>{const c=mkCanvas(8,128),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,8,128);return new THREE.CanvasTexture(c);})();

const FLOORS={'wood-dark':'Dark Wood','wood-light':'Light Wood','carpet-gray':'Gray Carpet','carpet-purple':'Purple Carpet','concrete':'Concrete','checker':'Checkerboard','tile':'White Tile','black-gloss':'Black Gloss'};
function floorTexture(kind){return cached('floor:'+kind,()=>{const c=mkCanvas(512,512),g=c.getContext('2d'),r=rng(kind);let rough=.6,metal=0;
 if(kind.startsWith('wood')){const L=kind==='wood-light';const b=L?[190,150,108]:[70,48,35];const rows=8,rh=64;for(let i=0;i<rows;i++){let x=-r()*220;while(x<512){const len=160+r()*220,v=(r()-.5)*34;g.fillStyle=`rgb(${b[0]+v|0},${b[1]+v*.8|0},${b[2]+v*.6|0})`;g.fillRect(x,i*rh,len,rh);g.strokeStyle='rgba(0,0,0,.09)';for(let k=0;k<7;k++){g.beginPath();const yy=i*rh+r()*rh;g.moveTo(x,yy);g.bezierCurveTo(x+len*.3,yy+(r()-.5)*9,x+len*.6,yy+(r()-.5)*9,x+len,yy);g.stroke();}g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x,i*rh,2,rh);x+=len;}g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,i*rh,512,2);}rough=.5;}

function setView(name){const R=S.room;if(name==='over'){Object.assign(goal,{theta:.62,phi:.98,r:Math.max(R.w,R.d)*1.55});goal.target.set(0,.8,0);}else if(name==='top'){Object.assign(goal,{theta:0,phi:.08,r:Math.max(R.w,R.d)*1.75});goal.target.set(0,0,0);}else if(name==='pov'){const ch=S.items.find(i=>i.type==='chair');const dk=S.items.find(i=>i.type==='desk');let eye,tg;if(ch){const a=ch.rot||0;const dir=new V3(Math.sin(a),0,Math.cos(a));eye=new V3(ch.x,1.18,ch.z).addScaledVector(dir,-.05);tg=eye.clone().addScaledVector(dir,.9);tg.y=1.02;}else if(dk){eye=new V3(dk.x,1.2,dk.z+1.1);tg=new V3(dk.x,1.0,dk.z);}else{eye=new V3(0,1.3,R.d/2-.4);tg=new V3(0,1.1,0);}const off=eye.clone().sub(tg);goal.r=off.length();goal.phi=Math.acos(clamp(off.y/goal.r,-1,1));goal.theta=Math.atan2(off.x,off.z);goal.target.copy(tg);}}
function updateCam(){const k=.16;let dt=goal.theta-cam.theta;cam.theta+=dt*k;cam.phi+=(goal.phi-cam.phi)*k;cam.r+=(goal.r-cam.r)*k;cam.target.lerp(goal.target,k);const sp=Math.sin(cam.phi);camera.position.set(cam.target.x+cam.r*sp*Math.sin(cam.theta),cam.target.y+cam.r*Math.cos(cam.phi),cam.target.z+cam.r*sp*Math.cos(cam.theta));camera.lookAt(cam.target);}
function pan(dx,dy){const k=goal.r*.0016,th=goal.theta;const right=new V3(Math.cos(th),0,-Math.sin(th)),fwd=new V3(-Math.sin(th),0,-Math.cos(th));goal.target.addScaledVector(right,-dx*k).addScaledVector(fwd,dy*k);const R=S.room;goal.target.x=clamp(goal.target.x,-R.w/2-1,R.w/2+1);goal.target.z=clamp(goal.target.z,-R.d/2-1,R.d/2+1);}

function startDrag(it,e,h){select(it.id);const d=DEFS[it.type];drag={it,sx:e.clientX,sy:e.clientY,moved:false,snap:JSON.stringify(S)};if(d.mount==='wall'){const wh=wallHit();if(wh&&wh.object.userData.wall===it.wall){const W=wallInfo(it.wall);const hu=wh.point.clone().sub(W.origin).dot(W.uAxis);drag.offU=(it.u||0)-hu;drag.offY=it.y-wh.point.y;}}else{const p=new V3();if(ray.ray.intersectPlane(new THREE.Plane(new V3(0,1,0),-(it.y||0)),p)){drag.off=new V3(it.x-p.x,0,it.z-p.z);}}drag.cap=captureRiders(it);drag.excl=new Set([it.id,...drag.cap.riders.map(r=>r.id)]);}

let undoStack=[],redoStack=[],lastSnap=null;const SAVE_KEY='setupstudio.v1';let warnedSave=false;
function snapshot(){return JSON.stringify(S);}
function commit(){const cur=snapshot();if(cur===lastSnap)return;if(lastSnap)undoStack.push(lastSnap);if(undoStack.length>60)undoStack.shift();redoStack=[];lastSnap=cur;if(!store.set(SAVE_KEY,cur)&&!warnedSave){warnedSave=true;toast('Heads up: layout too big to autosave (big images). Use Copy Layout to keep it.');}}
function restore(json){const st=JSON.parse(json);S={room:Object.assign({},DEFAULT_ROOM,st.room),items:st.items||[],pc:Object.assign(JSON.parse(JSON.stringify(DEFAULT_PC)),st.pc||{})};for(const g of groups.values()){scene.remove(g);disposeTree(g);}groups.clear();select(null);buildRoom();for(const it of S.items)buildItem(it);renderSide();}
function undo(){if(!undoStack.length){toast('Nothing to undo');return;}redoStack.push(lastSnap);lastSnap=undoStack.pop();restore(lastSnap);store.set(SAVE_KEY,lastSnap);}
function redo(){if(!redoStack.length){toast('Nothing to redo');return;}undoStack.push(lastSnap);lastSnap=redoStack.pop();restore(lastSnap);store.set(SAVE_KEY,lastSnap);}

/* ================= top bar ================= */
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#vOver').onclick=()=>setView('over');$('#vTop').onclick=()=>setView('top');$('#vPov').onclick=()=>setView('pov');
$('#bGlow').onclick=()=>{glowFx=!glowFx;$('#bGlow').classList.toggle('on',glowFx);toast(glowFx?'Glow effect on':'Glow effect off (faster)');};
if(!composer){$('#bGlow').classList.add('hidden');glowFx=false;}

/* ================= animation loop ================= */
const clock=new THREE.Clock(),tmpC=new THREE.Color(),tmpV=new V3();
function animColor(mode,base,t,off,out){switch(mode){case'rainbow':return out.setHSL(((t*.08+off*.05)%1+1)%1,1,.55);case'wave':return out.setHSL(((t*.18+off*.12)%1+1)%1,1,.55);case'breathe':return out.copy(base).multiplyScalar(.2+.8*(.5+.5*Math.sin(t*2.1+off*.3)));default:return out.copy(base);}}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;updateCam();
 for(const id of WALL_IDS){const wg=wallGroups[id];if(!wg)continue;const W=wallInfo(id);tmpV.copy(camera.position).sub(W.origin);wg.visible=tmpV.dot(W.normal)>0;}
 for(const it of S.items){const g=groups.get(it.id);if(!g)continue;if(DEFS[it.type].mount==='wall')g.visible=!!(wallGroups[it.wall]&&wallGroups[it.wall].visible);const mode=g.userData.mode||it.rgb||'static';if(mode!=='static'){for(const gl of g.userData.glows){if(gl.fixed)continue;animColor(mode,gl.base,t,gl.off,tmpC);gl.mat.color.copy(tmpC).multiplyScalar(gl.k);}}for(const s of g.userData.spin)s.rotation.z+=dt*14;for(const bo of g.userData.bob)bo.m.position.y=bo.y+Math.sin(t*.7+bo.ph)*.03;}
 if(S.room.edgeLed&&S.room.edgeMode!=='static'){for(const gl of roomGlows){animColor(S.room.edgeMode,gl.base,t,gl.off,tmpC);gl.mat.color.copy(tmpC).multiplyScalar(gl.k);}animColor(S.room.edgeMode,new THREE.Color(S.room.edgeColor),t,0,edgeLight.color);}
 let i=0;for(const it of S.items){const g=groups.get(it.id);if(!g||!g.visible)continue;const mode=g.userData.mode||it.rgb||'static';for(const L of g.userData.lights){if(i>=POOL.length)break;const pl=POOL[i++];pl.position.copy(L.pos);g.localToWorld(pl.position);if(L.fixed||mode==='static')pl.color.copy(L.base);else animColor(mode,L.base,t,L.off,pl.color);pl.intensity=L.intensity;pl.distance=L.dist*(it.scale||1);}}for(;i<POOL.length;i++)POOL[i].intensity=0;
 if(selBox)updSel();
 if(composer&&glowFx)composer.render();else renderer.render(scene,camera);}

/* ================= boot ================= */
async function boot(){try{await Promise.race([Promise.all(['900 40px Orbitron','20px "Press Start 2P"','40px Pacifico'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
 makeThumbs();renderTabs();
 const saved=store.get(SAVE_KEY);let ok=false;if(saved){try{restore(saved);lastSnap=saved;ok=true;}catch(e){console.warn(e);}}
 if(!ok){buildRoom();loadStarter();toast('Welcome! This is a starter room — change anything you like.');}
 renderSide();setView('over');cam.theta=goal.theta;cam.phi=goal.phi;cam.r=goal.r*1.3;cam.target.copy(goal.target);frame();}
boot();
})();
</script>
